<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions</title>
    <style>
        .container {
            background-color: antiquewhite;
            width: 50vw;
            height: 40vh;
        }

        .item {
            background-color: aquamarine;
            width: 5vw;
            height: 4vh;
            /* transition-duration: 3s;
            transition-delay: 1s;
            transition-property: all ;
            transition-timing-function: cubic-bezier(0.85,-0.02, 0.73, 0.55); */
            transition: all 4s cubic-bezier(0.85,-0.02, 0.73, 0.55) 0.5s ;
        }
        .translate{
            transform: translateX(10vw) translateY(10vh) scale(2);
        }
        .translatemore{
            transform: translateX(20vw) translateY(20vh) scale(3);
            background-color: blueviolet;
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="item translate">
            one
        </div>
        <div class="item translatemore">
            two
        </div>
    </div>
</body>

</html>
