<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crd design </title>
    <style>
        body{
            background-color: rgb(232, 228, 234);
        }
        .border {
            border: 1px solid black;
            width: 400px;
            min-height: 600px;
            border-radius: 10px;
            border-color: rgb(41, 39, 36);
            background-color: rgb(231, 226, 233);
        }

        .inborder {
            border: 1px solid black;
            width: 350px;
            height: 200px;
            margin: 20px;
            border-radius: 10px;
            border-color: azure;
            background-image: url("https://picsum.photos/g/399");
            background-size: cover;
            background-position: center;
        }

        .name {
            margin-left: 10px;
            font-size: 18px;
            margin: 30px;
            border: 0.06px solid rgb(53, 25, 25);
            border-radius: 7px;
            padding: 5px;
            text-align: center;
        }

        .des {
            font-size: 18px;
            margin: 14px;
            padding: 5px;
            border: 0.06px solid rgb(23, 10, 10);
            border-radius: 7px;
            text-align: center;
        }

        .head {
            margin-left: 25px;
            font-size: 30px;
            /* text-decoration: underline; */
            padding: 10px;
            font-family: 'Times New Roman', Times, serif;
        }

        .para {
            margin-left: 25px;
            margin-right: 25px;
            font-family: Arial, sans-serif;
            padding: 10px;
        }

        .read {
            display: flex;
            width: 120px;
            margin: 110px auto;
            /* text-align: center; */
            justify-content: center;
            font-size: 18px;
            color: rgba(45, 45, 218, 0.592);
            border: 0.06px solid rgb(23, 10, 10);
            border-radius: 6px;
            border-color: rgb(64, 83, 195);
            background-color: rgb(165, 206, 233);
            padding: 7px;
        }
    </style>
</head>

<body>
    <div class="border">

        <div class="inborder">


        </div>
        <span class="name"> Name </span>
        <span class="des"> Description </span>
        <h2 class="head">
            LOREM IPSUM
        </h2>
        <p class="para">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quae a quisquam placeat facilis error
            debitis dicta
            perspiciatis quos blanditiis accusamus!</p>
        <span class="read">
            Read more
        </span>
    </div>

</body>

</html>
