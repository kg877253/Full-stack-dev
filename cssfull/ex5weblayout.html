<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Short+Stack&display=swap');

        * {
            margin: 0;
            padding: 0;
            background-color: yellowgreen;
        }

        /* Navbar */

        nav ul {
            display: flex;
        }

        nav ul li {
            background-color: blueviolet;
            list-style: none;
            padding: 20px;
            border: 2px solid black;
            width: 100%;


        }

        /* Main green box */

        .box {
            border: 3px solid rgb(176, 25, 25);
            width: 100%;
            height: 520px;
            background-color: green;
            text-align: center;
        }

        .box1 {
            display: inline-block;
            width: 40%;
            height: 400px;
            margin: 45px;
            border: 3px solid black;
            background-color: rgba(247, 189, 103, 0.719);
        }

        .box2 {
            display: inline-block;
            width: 40%;
            height: 400px;
            margin: 45px;
            border: 3px solid black;
            background-color: rgb(120, 164, 232);
        }

        /* Header */

        .header {
            border: 4px solid black;
            padding: 100px;
            margin: 40px;
            border-radius: 70px;
            font-size: 60px;
            text-align: center;
            font-family: "Short Stack", cursive;
            font-weight: bold;
        }

        /* Circle */

        .logo {
            width: 50px;
            height: 50px;
            border: 1px solid black;
            border-radius: 50%;
            background: orangered;

            position: fixed;
            right: 20px;
            bottom: 30px;
        }

        /* Footer */

        .footer {
            border: 3px solid rgb(164, 78, 78);
            padding: 30px;
            background-color: rgb(207, 45, 169);
            font-size: 40px;
            text-align: center;
        }

        /* Sticky navbar */

        .stick {
            position: sticky;
            top: 0;
            z-index: 1;
        }
    </style>
</head>

<body>

    <header>

        <div class="stick">
            <nav>
                <ul>
                    <li>Home</li>
                    <li>About</li>
                    <li>Contact</li>
                </ul>
            </nav>
        </div>

        <div class="box">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

        <div class="logo"></div>

        <div class="header">
            MY NAME IS KARTIK AND I AM A WEB DEVELOPER
        </div>

    </header>

    <footer class="footer">
        i am footer
    </footer>

</body>

</html>
