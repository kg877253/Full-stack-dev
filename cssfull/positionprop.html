<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid black;
            width: 80vw;
            height: 400px;

            padding: 2px;
            margin: 3px;
        }

        .box1 {
            background-color: rgb(120, 91, 55);
            
        
            position: sticky;
            top: 3px;
            
        }

        .box2 {
            background-color: rgb(111, 79, 111);
            /* position: relative; */
            /* z-index: 1; */
        }

        .box3 {
            background-color: rgb(24, 28, 29);
            /* position:sticky; 
            top: 0px; */

        }

        .parent {
            border: 3px solid black;
            padding: 43px;
            margin: 30px;
            position: relative;

        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
    </div>
</body>

</html>
