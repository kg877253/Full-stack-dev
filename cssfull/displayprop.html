<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid rgb(151, 85, 85);
            display: inline-block;
            margin: 34px;
            
        }

        .box1 {
            display: flex;
            justify-content: center;
            /* display: none; */
            /* visibility: hidden; */
        }
    </style>
</head>

<body>
    <div class="box box1">
        i am a box
    </div>
    <div class="box">
        i am also a box
    </div>
    <span>
        i am good
    </span>

</body>

</html>
