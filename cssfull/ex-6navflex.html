<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex nav</title>
    <style>
        header {
            display: flex;
            list-style: none;
            justify-content: space-around;

        }

        nav ul {
            display: flex;
            list-style: none;
            /* justify-content: space-around; */
            gap: 20px;
        }

        nav ul li {
            /* margin: 10px; */
            font-size: large;
            display: flex;
            align-items: center;


        }

        .logo {
            width: 30px;
            height: 30px;
            border: 1px solid rgb(255, 255, 255);
        }

        main {
            border: 2px solid rgb(255, 255, 255);
            margin: 50px;
            padding: 100px;
            top: 0px;
            display: flex;
            justify-content: center;
            font-size: xxx-large;
        }
        .content {
            margin: 5px;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

    <header class="container">

        <nav>
            <ul>

                        </svg></li>

                        <path d="M6 9L11.2929 14.2929C11.6262 14.6262 11.7929 14.7929 12 14.7929C12.2071 14.7929 12.3738 14.6262 12.7071 14.2929L18 9" stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg></li>
