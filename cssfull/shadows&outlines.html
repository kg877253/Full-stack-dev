<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOWS AND OUTLINES</title>
    <style>
        .box{
            color: rgb(181, 143, 93);
            
            border:2px solid lightblue;
            display: inline;
            text-shadow: 2px 2px 4px rgb(16, 11, 4);
            box-shadow: 2px 2px 4px rgb(125, 20, 41);
        }
    </style>
</head>
<body>
    <div class="box">
        i am the boss
    </div>
</body>
</html>
