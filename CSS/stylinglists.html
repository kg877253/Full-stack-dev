<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling lists</title>
    <style>
        nav ul li {
            background-color: aquamarine;
            /* list-style: devanagari; */
            list-style: "🥀";
            list-style-position: inside;
            /* list-style: inside url("https://user-images.githubusercontent.com/14011726/94132137-7d4fc100-fe7c-11ea-8512-69f90cb65e48.gif"); */
            padding: 23px;
        }
        nav ul{
            display: flex;

        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
    </nav>
</body>

</html>
