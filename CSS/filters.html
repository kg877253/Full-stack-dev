<!DOCTYPE html>

<head>

    <style>

        .image1{

</head>

        <img  class="image2" src="https://w0.peakpx.com/wallpaper/394/252/HD-wallpaper-shahrukh-khan-srk-actor-hero.jpg" alt="">
    </div>
</body>
</html>
