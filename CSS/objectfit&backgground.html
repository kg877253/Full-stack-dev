<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object-fit and background fit properties</title>
    <style>
        .container {
            border: 2px solid black;
            background-color: rgb(12, 13, 14);
            width: 600px;
            height: 700px;
            background-image: url("https://www.shutterstock.com/image-photo/traveler-woman-arms-raised-triumph-260nw-2457990309.jpg");
            background-position: center center;
            background-repeat: no-repeat;
            background-clip: padding-box;
            background-size:contain;
            /* background-size: cover; */
        }

        img {
            width: 300px;
            height: 400px;
            /* object-fit: fill; */
            /* object-fit: contain; */
            object-fit: cover;
            /* object-position: center center; */
            object-position: top center;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- <img src="https://www.shutterstock.com/image-photo/traveler-woman-arms-raised-triumph-260nw-2457990309.jpg" alt=""> -->
    </div>
</body>

</html>
