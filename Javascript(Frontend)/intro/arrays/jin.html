<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function getAge() {
            return prompt("What is your age?");
        }
        let a = getAge();
        if(a>=18){
            alert("You are eligible to vote");
        }
        else if(a<18 && a>=0){
            alert("You are not eligible to vote");
        }
        else{
            console.error("entered negative value or string");
        }
        let b=confirm("Do you want prompt again?");
        if(b==true){
            let a = getAge();
            if(a>=18){
                alert("You are eligible to vote");
            }
            else if(a<18 && a>=0){
                alert("You are not eligible to vote");
            }
            else{
                console.error("entered negative value or string");
            }
        }
       
        
    </script>
</body>
</html>
