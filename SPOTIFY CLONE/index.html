<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>

    <header class="navbar flex align-center">

        <div class="logo-box">
            <svg role="img" viewBox="0 0 24 24" width="35" height="35" fill="#FFFFFF">
                <title>Spotify</title>
                <path
                    d="M13.427.01C6.805-.253 1.224 4.902.961 11.524.698 18.147 5.853 23.728 12.476 23.99c6.622.263 12.203-4.892 12.466-11.514S20.049.272 13.427.01m5.066 17.579a.717.717 0 0 1-.977.268 14.4 14.4 0 0 0-5.138-1.747 14.4 14.4 0 0 0-5.42.263.717.717 0 0 1-.338-1.392c1.95-.474 3.955-.571 5.958-.29 2.003.282 3.903.928 5.647 1.92a.717.717 0 0 1 .268.978m1.577-3.15a.93.93 0 0 1-1.262.376 17.7 17.7 0 0 0-5.972-1.96 17.7 17.7 0 0 0-6.281.238.93.93 0 0 1-1.11-.71.93.93 0 0 1 .71-1.11 19.5 19.5 0 0 1 6.94-.262 19.5 19.5 0 0 1 6.599 2.165c.452.245.62.81.376 1.263m1.748-3.551a1.147 1.147 0 0 1-1.546.488 21.4 21.4 0 0 0-6.918-2.208 21.4 21.4 0 0 0-7.259.215 1.146 1.146 0 0 1-.456-2.246 23.7 23.7 0 0 1 8.034-.24 23.7 23.7 0 0 1 7.657 2.445c.561.292.78.984.488 1.546" />
            </svg>
        </div>

        <div class="home-icon-box">
            <svg class="icon-circle" xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 48 48"
                style="fill:#FFFFFF;">
                <path
                    d="M39.5,43h-9c-1.381,0-2.5-1.119-2.5-2.5v-9c0-1.105-0.895-2-2-2h-4c-1.105,0-2,0.895-2,2v9c0,1.381-1.119,2.5-2.5,2.5h-9	C7.119,43,6,41.881,6,40.5V21.413c0-2.299,1.054-4.471,2.859-5.893L23.071,4.321c0.545-0.428,1.313-0.428,1.857,0L39.142,15.52	C40.947,16.942,42,19.113,42,21.411V40.5C42,41.881,40.881,43,39.5,43z">
                </path>
            </svg>
        </div>

        <div class="search-box flex align-center">
            <input class="search-input" type="text" placeholder="What do you want to play???">
        </div>

        <div class="profile-box flex align-center">
            <button class="signup-btn">Sign up</button>
            <button class="login-btn">Log in</button>
        </div>

    </header>

    <main>
        <div class="main-container flex">

            <div class="sidebar rborder">

                <div class="library-header flex align-center">
                    <div class="library-title">Your Library</div>
                    <div class="library-icons createplus flex align-center">
                        <svg class="icon-circle" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                        <div>Create</div>
                    </div>
                </div>
                <div class="library-list" id="songList">
                    <!-- songs yahan JS se aayenge -->
                </div>

                <div class="footer">
                    <div class="sidebar-footer">
                        <ul class="footer-links">
                            <li><a href="#">Legal</a></li>
                            <li><a href="#">Safety &amp; Privacy Center</a></li>
                            <li><a href="#">Privacy Policy</a></li>
                            <li><a href="#">Cookies</a></li>
                            <li><a href="#">About Ads</a></li>
                            <li><a href="#">Accessibility</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="content-box rborder">
                <div class="trendingsong">
                    <h2>Trending Songs</h2>
                    <div class="cardcontainer">
                        <div class="card">
                            <div class="playbutton">
                                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
                                    <circle cx="24" cy="24" r="24" fill="#1ED760" />
                                    <polygon points="18,14 36,24 18,34" fill="#000000" />
                                </svg>
                            </div>
                            <img src="https://i.scdn.co/image/ab67616d00001e0203cadf1b3fe324c1dc710ed4"
                                alt="Shakira image">
                            <div class="card-info">
                                <div>Dai Dai</div>
                                <p>Shakira,Burna roy</p>
                            </div>
                        </div>
                        <div class="card">
                            <div class="playbutton">
                                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
                                    <circle cx="24" cy="24" r="24" fill="#1ED760" />
                                    <polygon points="18,14 36,24 18,34" fill="#000000" />
                                </svg>
                            </div>
                            <img src="https://i.scdn.co/image/ab67616d00001e02a81b61a834db74333eb53a2e"
                                alt="Songs image">
                            <div class="card-info">
                                <div>Taare</div>
                                <p>Farak,Saswat Balan,10A</p>
                            </div>
                        </div>
                        <div class="card">
                            <div class="playbutton">
                                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
                                    <circle cx="24" cy="24" r="24" fill="#1ED760" />
                                    <polygon points="18,14 36,24 18,34" fill="#000000" />
                                </svg>
                            </div>
                            <img src="https://i.scdn.co/image/ab67616d00001e02a81b61a834db74333eb53a2e"
                                alt="Songs image">
                            <div class="card-info">
                                <div>Taare</div>
                                <p>Farak,Saswat Balan,10A</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="player-controls">
            <div class="controls-row flex align-center">
                <div class="now-playing-name" id="nowPlayingName">NO SONG PLAYING</div>

                <div class="playback-buttons flex align-center">
                    <div class="control-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                            fill="#b3b3b3">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                        </svg>
                    </div>

                    <div class="play-pausebtn">
                        <img id="playPauseIcon" src="play.svg" width="40" height="40" alt="play pause button">
                    </div>

                    <div class="control-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                            fill="#b3b3b3">
                            <path d="M16 6h2v12h-2zM6 6v12l8.5-6z" />
                        </svg>
                    </div>
                </div>

                <div class="time-info">
                    <span id="timeElapsed">0:00</span> / <span id="timeTotal">0:00</span>
                </div>
            </div>

            <div class="seekbar">
                <div class="circle"></div>
            </div>
        </div>

    </main>
    <script src="index.js"></script>
</body>

</html>
