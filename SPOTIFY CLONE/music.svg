<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
    width="512"
    height="512">

<defs>

    <!-- Main Background -->
    <linearGradient id="bgGradient"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="100%">

        <stop offset="0%" stop-color="#5EE7DF"/>
        <stop offset="40%" stop-color="#5B8CFF"/>
        <stop offset="75%" stop-color="#7367F0"/>
        <stop offset="100%" stop-color="#8E5CF6"/>

    </linearGradient>

    <!-- Ambient Top Light -->
    <radialGradient
        id="topGlow"
        cx="22%"
        cy="18%"
        r="70%">

        <stop offset="0%"
              stop-color="#FFFFFF"
              stop-opacity=".55"/>

        <stop offset="40%"
              stop-color="#FFFFFF"
              stop-opacity=".12"/>

        <stop offset="100%"
              stop-color="#FFFFFF"
              stop-opacity="0"/>

    </radialGradient>

    <!-- Bottom Purple Glow -->
    <radialGradient
        id="bottomGlow"
        cx="80%"
        cy="85%"
        r="75%">

        <stop offset="0%"
              stop-color="#9D6CFF"
              stop-opacity=".30"/>

        <stop offset="100%"
              stop-color="#9D6CFF"
              stop-opacity="0"/>

    </radialGradient>

    <!-- Soft Blur -->
    <filter id="blur40"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

        <feGaussianBlur stdDeviation="40"/>

    </filter>

    <!-- Glass Blur -->
    <filter id="glassBlur">

        <feGaussianBlur stdDeviation="8"/>

    </filter>

    <!-- Shadow -->
    <filter id="shadow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

        <feDropShadow
            dx="0"
            dy="16"
            stdDeviation="18"
            flood-color="#000000"
            flood-opacity=".22"/>

    </filter>

</defs>

<!-- Rounded Background -->

<rect
    width="512"
    height="512"
    rx="96"
    fill="url(#bgGradient)"/>

<!-- Ambient Lighting -->

<circle
    cx="110"
    cy="95"
    r="170"
    fill="url(#topGlow)"
    filter="url(#blur40)"/>

<circle
    cx="430"
    cy="430"
    r="180"
    fill="url(#bottomGlow)"
    filter="url(#blur40)"/>

<!-- Floating Light Orbs -->

<circle
    cx="115"
    cy="110"
    r="8"
    fill="white"
    opacity=".35"/>

<circle
    cx="415"
    cy="130"
    r="5"
    fill="white"
    opacity=".30"/>

<circle
    cx="390"
    cy="390"
    r="6"
    fill="white"
    opacity=".28"/>

<circle
    cx="150"
    cy="385"
    r="4"
    fill="white"
    opacity=".22"/>

<!-- Everything else goes here in Part 2 -->
<!-- ========================= -->
<!-- PREMIUM VINYL RECORD -->
<!-- ========================= -->

<defs>

    <!-- Vinyl Body -->
    <radialGradient id="vinylGradient"
        cx="35%"
        cy="28%"
        r="75%">

        <stop offset="0%" stop-color="#2B2B2B"/>
        <stop offset="35%" stop-color="#181818"/>
        <stop offset="100%" stop-color="#050505"/>

    </radialGradient>

    <!-- Vinyl Highlight -->
    <linearGradient id="vinylHighlight"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="100%">

        <stop offset="0%"
              stop-color="white"
              stop-opacity=".18"/>

        <stop offset="100%"
              stop-color="white"
              stop-opacity="0"/>

    </linearGradient>

    <!-- Center Label -->
    <radialGradient id="labelGradient">

        <stop offset="0%" stop-color="#43F97B"/>
        <stop offset="100%" stop-color="#1DB954"/>

    </radialGradient>

</defs>

<!-- Vinyl Shadow -->

<circle
    cx="256"
    cy="270"
    r="152"
    fill="black"
    opacity=".18"
    filter="url(#blur40)"/>

<!-- Main Vinyl -->

<circle
    cx="256"
    cy="256"
    r="145"
    fill="url(#vinylGradient)"
    filter="url(#shadow)"/>

<!-- Vinyl Grooves -->

<g
    stroke="#2A2A2A"
    stroke-width="2"
    fill="none"
    opacity=".85">

<circle cx="256" cy="256" r="124"/>
<circle cx="256" cy="256" r="112"/>
<circle cx="256" cy="256" r="100"/>
<circle cx="256" cy="256" r="88"/>
<circle cx="256" cy="256" r="76"/>
<circle cx="256" cy="256" r="64"/>

</g>

<!-- Highlight Ring -->

<circle
    cx="256"
    cy="256"
    r="132"
    stroke="url(#vinylHighlight)"
    stroke-width="3"
    fill="none"
    opacity=".75"/>

<!-- Gloss Reflection -->

<ellipse
    cx="215"
    cy="180"
    rx="92"
    ry="36"
    transform="rotate(-28 215 180)"
    fill="white"
    opacity=".08"/>

<ellipse
    cx="310"
    cy="315"
    rx="82"
    ry="28"
    transform="rotate(-28 310 315)"
    fill="white"
    opacity=".03"/>

<!-- Inner Ring -->

<circle
    cx="256"
    cy="256"
    r="46"
    fill="#121212"/>

<!-- Premium Label -->

<circle
    cx="256"
    cy="256"
    r="30"
    fill="url(#labelGradient)"/>

<!-- Center Hole -->

<circle
    cx="256"
    cy="256"
    r="8"
    fill="#F9F9F9"/>

<!-- Tiny Reflection -->

<circle
    cx="248"
    cy="247"
    r="4"
    fill="white"
    opacity=".45"/>
    <!-- ========================= -->
<!-- GLASS MUSIC NOTE -->
<!-- ========================= -->

<defs>

    <linearGradient id="noteGradient"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="100%">

        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#F3F4F6"/>

    </linearGradient>

    <filter id="noteGlow"
            x="-60%"
            y="-60%"
            width="220%"
            height="220%">

        <feDropShadow
            dx="0"
            dy="8"
            stdDeviation="12"
            flood-color="#3B82F6"
            flood-opacity=".25"/>

    </filter>

</defs>

<!-- Floating Note -->

<g transform="translate(292 132)"
   filter="url(#noteGlow)">

<path
fill="url(#noteGradient)"
d="
M18 0
V120

C18 136 5 148 -14 148
C-33 148 -48 136 -48 120
C-48 104 -33 92 -14 92
C-5 92 3 95 10 99

V28

L94 8

V96

C94 112 81 124 62 124
C43 124 28 112 28 96
C28 80 43 68 62 68
C71 68 79 71 86 75

V0
Z"/>

</g>

<!-- Small Floating Sparkles -->

<g fill="white">

<circle cx="136" cy="145" r="2.5" opacity=".75"/>
<circle cx="372" cy="108" r="2" opacity=".8"/>
<circle cx="405" cy="320" r="2.3" opacity=".65"/>
<circle cx="122" cy="332" r="1.8" opacity=".7"/>

</g>

<!-- Tiny Cross Sparkles -->

<g
stroke="white"
stroke-linecap="round"
opacity=".45">

<path d="M150 160 v10"/>
<path d="M145 165 h10"/>

<path d="M390 150 v8"/>
<path d="M386 154 h8"/>

<path d="M390 360 v10"/>
<path d="M385 365 h10"/>

</g>

<!-- Soft Top Shine -->

<path
d="
M90 95
Q256 35 422 95"
fill="none"
stroke="white"
stroke-width="6"
stroke-linecap="round"
opacity=".08"/>

<!-- Soft Bottom Shine -->

<path
d="
M110 420
Q256 470 402 420"
fill="none"
stroke="white"
stroke-width="5"
stroke-linecap="round"
opacity=".05"/>
</svg>